<!doctype html>

<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KTOOL — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#0f172a; /* slate-900 */
      --bg2:#071025; /* deep */
      --accent1:#8b5cf6; /* violet */
      --accent2:#06b6d4; /* cyan */
      --accent3:#f97316; /* orange */
      --glass: rgba(255,255,255,0.03);
    }
    html,body{height:100%;margin:0;background:radial-gradient(1000px 600px at 10% 10%, rgba(139,92,246,0.12), transparent), radial-gradient(800px 500px at 90% 90%, rgba(6,182,212,0.08), transparent), linear-gradient(180deg,var(--bg1),var(--bg2));font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;color:#dbeafe;display:flex;align-items:center;justify-content:center}
    .wrap{width:min(900px,92vw);text-align:center;padding:36px;border-radius:18px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow: 0 10px 30px rgba(2,6,23,0.7), inset 0 1px 0 rgba(255,255,255,0.02);backdrop-filter: blur(6px);}
    .logo{font-weight:800;letter-spacing:1px;font-size:46px;margin:6px 0;display:inline-block}
    .tag{font-weight:600;margin-bottom:10px;opacity:0.9}/* Neon letters */
.neon{display:inline-block}
.neon span{display:inline-block;transform: translateY(6px);padding:0 2px}
.neon span.on{animation: glow 1.8s ease-in-out forwards;}
.neon span.off{opacity:0.22;filter: blur(0.3px);}

@keyframes glow{
  0%{color:#ffffff;text-shadow: none;transform: translateY(10px) scale(0.96);opacity:0}
  35%{opacity:1;transform: translateY(0) scale(1)}
  60%{text-shadow:0 0 14px rgba(139,92,246,0.14),0 0 28px rgba(6,182,212,0.08),0 0 40px rgba(249,115,22,0.03)}
  100%{text-shadow:0 0 30px rgba(139,92,246,0.28),0 0 50px rgba(6,182,212,0.22),0 0 80px rgba(249,115,22,0.08);}
}

/* subtle moving gradient scan */
.shine{
  position:relative;display:inline-block;overflow:hidden;vertical-align:middle
}
.shine::after{content:"";position:absolute;left:-40%;top:0;width:60%;height:100%;transform:skewX(-18deg);background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0) 100%);animation: sweep 3.2s linear infinite}
@keyframes sweep{to{left:140%}}

/* loading dots */
.loading{font-weight:600;margin-top:18px;opacity:0.94}
.dots span{display:inline-block;width:8px;height:8px;margin:0 4px;border-radius:50%;background:linear-gradient(180deg,var(--accent2),var(--accent1));opacity:0.18;animation: dot 1s infinite}
.dots span:nth-child(1){animation-delay:0.05s}
.dots span:nth-child(2){animation-delay:0.25s}
.dots span:nth-child(3){animation-delay:0.45s}
@keyframes dot{50%{opacity:1;transform: translateY(-6px) scale(1.1)}100%{opacity:0.18;transform: translateY(0)}}

/* footer small */
.meta{margin-top:22px;opacity:0.6;font-size:13px}

/* responsive */
@media (max-width:520px){.logo{font-size:34px}.wrap{padding:22px}}

  </style>
</head>
<body>
  <div class="wrap">
    <div class="tag">KTOOL</div>
    <div class="logo shine" aria-hidden="true">
      <div id="mainText" class="neon" aria-hidden="true">KTOOL Coming Soon</div>
    </div><div class="loading" id="loading">Loading <span class="dots"><span></span><span></span><span></span></span></div>

<div class="meta">Designed for quick flex — minimal, flashy, functional.</div>

  </div>  <script>
    // Split letters into spans and animate sequentially
    (function(){
      const el = document.getElementById('mainText');
      const txt = el.textContent.trim();
      el.innerHTML = '';
      const chars = Array.from(txt);
      chars.forEach((ch,i)=>{
        const sp = document.createElement('span');
        sp.textContent = ch === ' ' ? '\u00A0' : ch;
        sp.className = 'off';
        el.appendChild(sp);
      });

      // progressive lighting
      const spans = el.querySelectorAll('span');
      let idx = 0;
      function tick(){
        if(idx < spans.length){
          spans[idx].classList.remove('off');
          spans[idx].classList.add('on');
          // color shift using inline gradient-ish via text-shadow color cycling
          spans[idx].style.color = '#fff';
          // subtle multi-color glow based on index
          const phase = idx % 3;
          if(phase===0) spans[idx].style.textShadow = '0 0 18px rgba(139,92,246,0.9),0 0 36px rgba(139,92,246,0.5)';
          if(phase===1) spans[idx].style.textShadow = '0 0 18px rgba(6,182,212,0.9),0 0 36px rgba(6,182,212,0.5)';
          if(phase===2) spans[idx].style.textShadow = '0 0 18px rgba(249,115,22,0.9),0 0 36px rgba(249,115,22,0.45)';
          idx++;
          setTimeout(tick, 70); // speed of lighting
        } else {
          // loop: fade out then restart after a pause
          setTimeout(()=>{
            spans.forEach((s,i)=>{ s.classList.remove('on'); s.classList.add('off'); s.style.textShadow=''; });
            idx=0; setTimeout(tick, 600);
          }, 2400);
        }
      }
      // small startup delay for dramatic effect
      setTimeout(tick, 420);

      // loading dots text change to mimic progress
      const loading = document.getElementById('loading');
      let prog = 0;
      setInterval(()=>{
        prog = (prog + 1) % 100;
        if(prog < 70){ loading.textContent = 'Loading ' ; const dots = document.createElement('span'); dots.className='dots'; dots.innerHTML = '<span></span><span></span><span></span>'; loading.appendChild(dots);} else if(prog < 90){ loading.textContent = 'Almost ready ' ; const dots = document.createElement('span'); dots.className='dots'; dots.innerHTML = '<span></span><span></span><span></span>'; loading.appendChild(dots);} else { loading.textContent = 'Hold tight ' ; const dots = document.createElement('span'); dots.className='dots'; dots.innerHTML = '<span></span><span></span><span></span>'; loading.appendChild(dots);} 
      }, 1200);

    })();
  </script></body>
</html>
